# Opens every link on both copies of the site, four times a day. A failure emails the repo owner.
name: links
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/check_links.py https://boltanote.vercel.app
      - run: python scripts/check_links.py https://hassan-ali-mehdi-3024.github.io/boltanote
